<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="領収書">
<meta name="theme-color" content="#1e1b16">
<title>領収書作成</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500&display=swap');

:root {
  --bg:      #1a1710;
  --surface: #242018;
  --card:    #2c2820;
  --border:  #3e3628;
  --gold:    #c8a855;
  --gold2:   #8b6914;
  --text:    #e8e4dc;
  --muted:   #7a6e60;
  --green:   #1e4d2b;
  --green2:  #b8e8c8;
  --red:     #4d1e1e;
  --red2:    #e8b8b8;
  --ink:     #1a1a1a;
  --paper-border: #c8c0b0;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top:    env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  overscroll-behavior: none;
}

/* ===== APP SHELL ===== */
#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  position: relative;
}

/* ===== TOP BAR ===== */
#topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  padding-top: var(--safe-top);
  display: flex;
  align-items: center;
  gap: 12px;
  height: calc(52px + var(--safe-top));
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 100;
}
#topbar h1 {
  font-family: 'Noto Serif JP', serif;
  font-size: 16px;
  letter-spacing: 0.2em;
  color: var(--gold);
  flex: 1;
}
#btn-settings {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 22px;
  cursor: pointer;
  padding: 6px;
  border-radius: 6px;
  line-height: 1;
}

/* ===== TAB BAR ===== */
#tabbar {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tab-btn {
  flex: 1;
  padding: 12px 0;
  background: none;
  border: none;
  color: var(--muted);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px;
  letter-spacing: 0.05em;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
}
.tab-btn.active {
  color: var(--gold);
  border-bottom-color: var(--gold);
}

/* ===== SCROLL CONTENT ===== */
#content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* ===== TAB PANELS ===== */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ===== FORM ===== */
#form-panel {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

.form-section {
  background: var(--card);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 14px;
}
.form-section-title {
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--muted);
  padding: 10px 16px 6px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
}

.field {
  display: flex;
  align-items: center;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  min-height: 52px;
}
.field:last-child { border-bottom: none; }

.field label {
  font-size: 13px;
  color: var(--muted);
  width: 80px;
  flex-shrink: 0;
  line-height: 1.3;
}
.field label.wide { width: 96px; }

.field input,
.field select {
  flex: 1;
  background: none;
  border: none;
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 15px;
  padding: 14px 0;
  outline: none;
  text-align: right;
  min-width: 0;
}
.field input::placeholder { color: #4a4035; }
.field select {
  -webkit-appearance: none;
  appearance: none;
  text-align: right;
}

.field-textarea {
  flex-direction: column;
  align-items: flex-start;
  padding: 10px 16px;
  gap: 6px;
}
.field-textarea label {
  width: auto;
  font-size: 12px;
}
.field-textarea textarea {
  width: 100%;
  background: none;
  border: none;
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px;
  outline: none;
  resize: none;
  min-height: 60px;
  line-height: 1.6;
}
.field-textarea textarea::placeholder { color: #4a4035; }

/* 印鑑 */
.seal-row {
  flex-direction: column;
  align-items: flex-start;
  padding: 12px 16px;
  gap: 10px;
}
.seal-row label { width: auto; font-size: 12px; }
.seal-trigger {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
}
.seal-thumb {
  width: 52px; height: 52px;
  border-radius: 8px;
  border: 1px dashed var(--border);
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 22px;
  overflow: hidden; flex-shrink: 0;
  position: relative; cursor: pointer;
}
.seal-thumb img { width: 100%; height: 100%; object-fit: contain; }
.seal-thumb input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer;
  width: 100%; height: 100%;
}
.seal-info { flex: 1; font-size: 12px; color: var(--muted); line-height: 1.6; }
.seal-clear {
  background: none; border: 1px solid var(--border);
  color: var(--muted); border-radius: 6px;
  padding: 4px 12px; font-size: 12px; cursor: pointer;
}

/* ===== ACTION BUTTONS ===== */
#action-panel {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: calc(16px + var(--safe-bottom));
}

.btn-primary {
  background: var(--gold2);
  color: #fff8e8;
  border: none;
  border-radius: 12px;
  padding: 16px;
  font-family: 'Noto Serif JP', serif;
  font-size: 16px;
  letter-spacing: 0.1em;
  cursor: pointer;
  width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background 0.15s, transform 0.1s;
  -webkit-appearance: none;
}
.btn-primary:active { background: #a07c1e; transform: scale(0.98); }

.btn-green {
  background: var(--green);
  color: var(--green2);
  border: 1px solid #2d6b3c;
  border-radius: 12px;
  padding: 15px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 15px;
  cursor: pointer;
  width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background 0.15s, transform 0.1s;
  -webkit-appearance: none;
}
.btn-green:active { background: #265e36; transform: scale(0.98); }
.btn-green:disabled { opacity: 0.5; }

.btn-ghost {
  background: none;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px;
  font-size: 13px;
  cursor: pointer;
  width: 100%;
  transition: color 0.15s;
  -webkit-appearance: none;
}
.btn-ghost:active { color: var(--text); }

/* ===== PREVIEW TAB ===== */
#preview-panel {
  padding: 16px;
  padding-bottom: calc(80px + var(--safe-bottom));
}

/* 領収書スケール表示 */
#receipt-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

#receipt {
  background: #fff;
  width: 640px;
  border: 1.5px solid var(--paper-border);
  padding: 28px 36px 24px;
  font-family: 'Noto Serif JP', serif;
  color: var(--ink);
  position: relative;
  border-radius: 4px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.2);
  transform-origin: top left;
}

.r-title {
  text-align: center;
  font-size: 22px;
  letter-spacing: 1.2em;
  font-weight: 700;
  margin-bottom: 20px;
  padding-right: 1.2em;
}
.r-meta {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
}
.r-addressee {
  font-size: 15px;
  font-weight: 700;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 2px;
  display: inline-block;
}
.r-date { font-size: 12px; color: #333; text-align: right; line-height: 1.8; }

.r-amount-line {
  display: flex; align-items: baseline; gap: 10px;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 5px; margin-bottom: 4px;
}
.r-yen { font-size: 18px; font-weight: 700; }
.r-num { font-size: 30px; font-weight: 700; flex: 1; }
.r-tax-label { font-size: 12px; color: #555; align-self: flex-end; margin-bottom: 3px; }
.r-tadashi-text { font-size: 12px; color: #555; }
.r-confirm { font-size: 12px; margin: 12px 0 8px; }

.r-bottom { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.r-breakdown { border-collapse: collapse; font-size: 11px; flex: 1; }
.r-breakdown td { padding: 3px 8px 3px 0; border-top: 1px solid #ccc; border-bottom: 1px solid #ccc; }
.r-breakdown td:last-child { text-align: left; padding-left: 8px; }

.r-issuer { text-align: right; font-size: 11px; line-height: 1.9; position: relative; }
.r-shop-name { font-size: 17px; font-weight: 700; display: block; margin-bottom: 2px; }
.r-seal-img {
  position: absolute; right: -8px; top: -18px;
  width: 95px; height: 95px; object-fit: contain; opacity: 0.9;
}

/* プレビュー内スケール調整（JS で動的に設定） */
#receipt-scale-wrap {
  width: 100%;
  overflow: hidden;
}

/* ===== BOTTOM NAV（固定フッター） ===== */
#bottom-actions {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 520px;
  padding: 10px 16px;
  padding-bottom: calc(10px + var(--safe-bottom));
  background: rgba(26,23,16,0.95);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  z-index: 200;
}
#bottom-actions .btn-primary { font-size: 14px; padding: 13px; }
#bottom-actions .btn-green   { font-size: 14px; padding: 12px; }

/* ===== MODAL ===== */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 500;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal-sheet {
  background: var(--card);
  border-radius: 20px 20px 0 0;
  padding: 20px 20px;
  padding-bottom: calc(20px + var(--safe-bottom));
  width: 100%;
  max-width: 520px;
  max-height: 85vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(60px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

.modal-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 4px;
}
.modal-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 16px;
  color: var(--gold);
  text-align: center;
}
.modal-desc {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.7;
  background: var(--surface);
  border-radius: 8px;
  padding: 12px 14px;
}
.modal-field { display: flex; flex-direction: column; gap: 6px; }
.modal-field label { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }
.modal-field input {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 14px;
  font-family: 'Noto Sans JP', sans-serif;
  outline: none;
  width: 100%;
}
.modal-field input:focus { border-color: var(--gold); }
.modal-actions { display: flex; gap: 10px; }
.modal-actions button { flex: 1; }

/* ===== TOAST ===== */
#toast {
  position: fixed;
  bottom: calc(80px + var(--safe-bottom));
  left: 50%; transform: translateX(-50%) translateY(12px);
  background: #1a3d24;
  color: var(--green2);
  padding: 10px 22px;
  border-radius: 24px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  z-index: 9999;
  white-space: nowrap;
  border: 1px solid #2d6b3c;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.error { background: #3d1a1a; color: var(--red2); border-color: #6b2d2d; }

/* ===== PRINT ===== */
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  /* UI要素をすべて非表示 */
  #topbar, #tabbar, #bottom-actions, #toast,
  .modal-overlay, #form-panel, #action-panel { display: none !important; }

  /* 背景・ボディ：真っ白 */
  html, body {
    background: #ffffff !important;
    margin: 0 !important;
    padding: 0 !important;
    height: auto !important;
  }

  /* アプリシェルをリセット */
  #app {
    max-width: none !important;
    height: auto !important;
    background: #ffffff !important;
    display: block !important;
  }

  #content {
    overflow: visible !important;
    background: #ffffff !important;
  }

  /* すべてのタブパネルを表示状態に（印刷時は全描画が必要） */
  .tab-panel { display: block !important; }

  /* 入力フォームパネルは非表示 */
  #tab-form { display: none !important; }

  /* プレビューパネル：A4中央配置 */
  #preview-panel {
    padding: 0 !important;
    background: #ffffff !important;
    display: block !important;
  }

  #receipt-scale-wrap {
    overflow: visible !important;
    width: auto !important;
    height: auto !important;
  }

  /* 領収書本体：A4幅に合わせて中央配置・真っ白余白 */
  #receipt {
    width: 190mm !important;
    margin: 10mm auto 0 !important;
    transform: none !important;
    box-shadow: none !important;
    border: 1px solid #bbb !important;
    border-radius: 0 !important;
    page-break-inside: avoid !important;
    background: #ffffff !important;
  }

  /* 印鑑は印刷でも25mm固定 */
  .r-seal-img {
    width: 95px !important;
    height: 95px !important;
  }
}
</style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <div id="topbar">
    <h1>領　収　書</h1>
    <button id="btn-settings" onclick="openModal('gas-modal')" title="設定">⚙</button>
  </div>

  <!-- TAB BAR -->
  <div id="tabbar">
    <button class="tab-btn active" onclick="switchTab('form')">✏️ 入力</button>
    <button class="tab-btn" onclick="switchTab('preview')">👁 プレビュー</button>
  </div>

  <!-- CONTENT -->
  <div id="content">

    <!-- 入力タブ -->
    <div id="tab-form" class="tab-panel active">
      <div id="form-panel">

        <!-- 領収書情報 -->
        <div class="form-section">
          <div class="form-section-title">領収書情報</div>

          <div class="field">
            <label>宛名</label>
            <input type="text" id="f-addressee" placeholder="〇〇" inputmode="text" autocomplete="off">
          </div>

          <div class="field">
            <label>発行日</label>
            <input type="date" id="f-date">
          </div>

          <div class="field">
            <label>金額（税込）</label>
            <input type="number" id="f-amount" placeholder="18700" inputmode="numeric">
          </div>

          <div class="field">
            <label>消費税率</label>
            <select id="f-taxrate">
              <option value="10">10%</option>
              <option value="8">8%（軽減）</option>
              <option value="0">非課税</option>
            </select>
          </div>

          <div class="field field-textarea">
            <label>但書</label>
            <textarea id="f-tadashi" placeholder="例：5月23日 なつつばき ご利用分" rows="2"></textarea>
          </div>
        </div>

        <!-- 発行者情報 -->
        <div class="form-section">
          <div class="form-section-title">発行者情報</div>

          <div class="field">
            <label>屋号</label>
            <input type="text" id="f-shopname" placeholder="高仙の里 よの" inputmode="text" autocomplete="off">
          </div>

          <div class="field field-textarea">
            <label>住所・TEL</label>
            <textarea id="f-issuer" placeholder="株式会社 ライフギアプロジェクト&#10;719-3222 岡山県真庭市余野下465&#10;TEL 0867-42-6336" rows="3"></textarea>
          </div>

          <div class="field seal-row">
            <label>印鑑</label>
            <div class="seal-trigger">
              <div class="seal-thumb" id="seal-thumb">
                <span id="seal-icon">🔵</span>
                <img id="seal-preview" src="" alt="" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;">
                <input type="file" id="f-seal" accept="image/*">
              </div>
              <div class="seal-info" id="seal-info">タップして印鑑画像を選択<br><span style="font-size:11px;">PNG推奨・localStorage保存</span></div>
              <button class="seal-clear" id="seal-clear-btn" onclick="clearSeal()" style="display:none;">削除</button>
            </div>
          </div>
        </div>

        <!-- アクション -->
        <div id="action-panel">
          <button class="btn-primary" onclick="printWithTitle()">🖨 印刷・PDF保存</button>
          <button class="btn-green" id="btn-save-sheet" onclick="saveToSheet()">
            <span>📊</span><span id="save-btn-text">スプレッドシートに保存</span>
          </button>
          <button class="btn-ghost" onclick="openModal('gas-modal')">⚙ スプレッドシート連携設定</button>
          <button class="btn-ghost" onclick="clearAll()" style="color:#6a4040;border-color:#4a3030;">リセット</button>
        </div>
      </div>
    </div>

    <!-- プレビュータブ -->
    <div id="tab-preview" class="tab-panel">
      <div id="preview-panel">
        <div id="receipt-scale-wrap">
          <div id="receipt-wrap">
            <div id="receipt">
              <div class="r-title">領　収　書</div>
              <div class="r-meta">
                <div class="r-addressee" id="r-addressee">　　　　　　　様</div>
                <div class="r-date">発行日　<span id="r-date">令和　年　月　日</span></div>
              </div>
              <div class="r-amount-line">
                <span class="r-yen">¥</span>
                <span class="r-num" id="r-amount">0</span>
                <span style="font-size:17px;">－</span>
                <span class="r-tax-label">（税込）</span>
              </div>
              <div class="r-tadashi-text">但</div>
              <div class="r-confirm">上記正に領収いたしました。</div>
              <div class="r-bottom">
                <table class="r-breakdown">
                  <tr><td>内訳</td><td id="r-tadashi">　</td></tr>
                  <tr><td>税抜金額</td><td id="r-taxbase">　</td></tr>
                  <tr><td>消費税額等</td><td id="r-taxamt">　</td></tr>
                </table>
                <div class="r-issuer">
                  <span class="r-shop-name" id="r-shopname">　</span>
                  <div id="r-issuer-text" style="white-space:pre-line;font-family:'Noto Sans JP',sans-serif;font-size:11px;">　</div>
                  <img id="r-seal" class="r-seal-img" src="" style="display:none;" alt="">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /content -->

  <!-- BOTTOM ACTIONS（プレビュータブ時のみ表示） -->
  <div id="bottom-actions" style="display:none;">
    <button class="btn-primary" onclick="printWithTitle()" style="flex:1;">🖨 印刷・PDF</button>
    <button class="btn-green" onclick="saveToSheet()" style="flex:1;">📊 シートに保存</button>
  </div>

</div><!-- /app -->

<!-- GAS設定 モーダル -->
<div class="modal-overlay" id="gas-modal" onclick="bgClose(event,'gas-modal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">📊 スプレッドシート連携</div>
    <div class="modal-desc">
      Google Apps Script（GAS）のWebアプリURLを入力してください。<br>
      GASスクリプトは同梱の <strong>gas_script.gs</strong> を使用します。<br><br>
      デプロイ手順：<br>
      スクリプトエディタ → デプロイ → 新しいデプロイ<br>
      → 種類：ウェブアプリ → アクセス：全員 → デプロイ
    </div>
    <div class="modal-field">
      <label>GAS WebアプリURL</label>
      <input type="url" id="modal-gas-url" placeholder="https://script.google.com/macros/s/.../exec" inputmode="url">
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal('gas-modal')">キャンセル</button>
      <button class="btn-primary" onclick="saveGasUrl()" style="border-radius:10px;font-size:14px;padding:12px;">保存</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ===== 印刷（ファイル名を宛名から生成） =====
function printWithTitle() {
  const addressee = document.getElementById('f-addressee').value.trim();
  const filename = addressee ? `領収書_${addressee}様` : '領収書';
  const prev = document.title;
  document.title = filename;
  window.print();
  // 印刷ダイアログが閉じた後にタイトルを戻す
  setTimeout(() => { document.title = prev; }, 2000);
}

// ===== タブ =====
let currentTab = 'form';
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelectorAll('.tab-btn')[tab === 'form' ? 0 : 1].classList.add('active');
  document.getElementById('bottom-actions').style.display = tab === 'preview' ? 'flex' : 'none';
  if (tab === 'preview') { scaleReceipt(); updateReceipt(); }
}

// ===== 領収書スケール =====
function scaleReceipt() {
  const wrap = document.getElementById('receipt-scale-wrap');
  const receipt = document.getElementById('receipt');
  const w = wrap.clientWidth - 32;
  const scale = Math.min(1, w / 640);
  receipt.style.transform = `scale(${scale})`;
  receipt.style.transformOrigin = 'top left';
  wrap.style.height = (receipt.offsetHeight * scale + 8) + 'px';
}
window.addEventListener('resize', scaleReceipt);

// ===== ユーティリティ =====
function toReiwa(dateStr) {
  if (!dateStr) return '令和　年　月　日';
  const d = new Date(dateStr + 'T00:00:00');
  return `令和${d.getFullYear()-2018}年${d.getMonth()+1}月${d.getDate()}日`;
}
function fmt(n) { return Number(n).toLocaleString('ja-JP'); }
function calcTax(total, rate) {
  const base = Math.floor(total / (1 + rate / 100));
  return { base, tax: total - base };
}

// ===== Toast =====
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isError ? ' error' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = '', 3000);
}

// ===== Storage =====
const SK = 'receipt_v2', SEAL_K = 'receipt_seal_v1', GAS_K = 'receipt_gas_url_v1';

function saveForm() {
  localStorage.setItem(SK, JSON.stringify({
    addressee: v('f-addressee'), date: v('f-date'), amount: v('f-amount'),
    taxrate: v('f-taxrate'), tadashi: v('f-tadashi'),
    shopname: v('f-shopname'), issuer: v('f-issuer'),
  }));
}
function loadForm() {
  try {
    const d = JSON.parse(localStorage.getItem(SK) || 'null');
    if (!d) return;
    sv('f-addressee', d.addressee); sv('f-date', d.date); sv('f-amount', d.amount);
    sv('f-taxrate', d.taxrate || '10'); sv('f-tadashi', d.tadashi);
    sv('f-shopname', d.shopname); sv('f-issuer', d.issuer);
  } catch(e) {}
}
function v(id)  { return document.getElementById(id).value; }
function sv(id, val) { if (val != null) document.getElementById(id).value = val; }

// ===== Modal =====
function openModal(id) {
  if (id === 'gas-modal') {
    document.getElementById('modal-gas-url').value = localStorage.getItem(GAS_K) || '';
  }
  document.getElementById(id).classList.add('open');
}
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function bgClose(e, id) { if (e.target === e.currentTarget) closeModal(id); }

function saveGasUrl() {
  const url = document.getElementById('modal-gas-url').value.trim();
  if (url) { localStorage.setItem(GAS_K, url); showToast('✓ URL を保存しました'); }
  else { localStorage.removeItem(GAS_K); showToast('URLをクリアしました'); }
  closeModal('gas-modal');
}

// ===== 印鑑 =====
let sealUrl = null;
function applySeal(url) {
  sealUrl = url;
  const img = document.getElementById('seal-preview');
  img.src = url; img.style.display = '';
  document.getElementById('seal-icon').style.display = 'none';
  document.getElementById('seal-info').textContent = '印鑑設定済み';
  document.getElementById('seal-clear-btn').style.display = '';
  document.getElementById('r-seal').src = url;
  document.getElementById('r-seal').style.display = '';
  try { localStorage.setItem(SEAL_K, url); } catch(e) {}
}
function clearSeal() {
  sealUrl = null;
  document.getElementById('seal-preview').style.display = 'none';
  document.getElementById('seal-icon').style.display = '';
  document.getElementById('seal-info').innerHTML = 'タップして印鑑画像を選択<br><span style="font-size:11px;">PNG推奨・localStorage保存</span>';
  document.getElementById('seal-clear-btn').style.display = 'none';
  document.getElementById('f-seal').value = '';
  document.getElementById('r-seal').style.display = 'none';
  localStorage.removeItem(SEAL_K);
}
document.getElementById('f-seal').addEventListener('change', function(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => applySeal(ev.target.result);
  r.readAsDataURL(f);
});

// ===== リセット =====
function clearAll() {
  if (!confirm('すべてリセットしますか？')) return;
  ['f-addressee','f-amount','f-tadashi','f-shopname','f-issuer'].forEach(id => sv(id,''));
  sv('f-taxrate','10');
  sv('f-date', new Date().toISOString().split('T')[0]);
  localStorage.removeItem(SK);
  updateReceipt();
}

// ===== 領収書更新 =====
function getFormData() {
  const amount = parseInt(v('f-amount')) || 0;
  const taxrate = parseInt(v('f-taxrate')) || 0;
  return {
    addressee: v('f-addressee').trim(),
    dateStr:   v('f-date'),
    amount, taxrate,
    tadashi:  v('f-tadashi').trim(),
    shopname: v('f-shopname').trim(),
    issuer:   v('f-issuer').trim(),
  };
}

function updateReceipt() {
  const { addressee, dateStr, amount, taxrate, tadashi, shopname, issuer } = getFormData();
  document.getElementById('r-addressee').textContent = (addressee || '　　　　　　') + '　様';
  document.getElementById('r-date').textContent = toReiwa(dateStr);
  document.getElementById('r-amount').textContent = fmt(amount);
  document.getElementById('r-tadashi').textContent = tadashi || '　';
  if (amount > 0 && taxrate > 0) {
    const { base, tax } = calcTax(amount, taxrate);
    document.getElementById('r-taxbase').textContent = `${taxrate}% 対象　¥${fmt(base)}`;
    document.getElementById('r-taxamt').textContent = `${taxrate}%　¥${fmt(tax)}`;
  } else if (taxrate === 0) {
    document.getElementById('r-taxbase').textContent = '非課税';
    document.getElementById('r-taxamt').textContent = '－';
  } else {
    document.getElementById('r-taxbase').textContent = '　';
    document.getElementById('r-taxamt').textContent = '　';
  }
  document.getElementById('r-shopname').textContent = shopname || '　';
  document.getElementById('r-issuer-text').textContent = issuer || '　';
  saveForm();
}

// ===== スプレッドシート保存 =====
async function saveToSheet() {
  const gasUrl = localStorage.getItem(GAS_K) || '';
  if (!gasUrl) { openModal('gas-modal'); showToast('まずGAS URLを設定してください', true); return; }
  const { addressee, dateStr, amount, taxrate, tadashi, shopname, issuer } = getFormData();
  if (!addressee || !dateStr || !amount) { showToast('宛名・発行日・金額を入力してください', true); return; }
  let taxBase = '', taxAmt = '';
  if (amount > 0 && taxrate > 0) { const r = calcTax(amount, taxrate); taxBase = r.base; taxAmt = r.tax; }
  const now = new Date();
  const savedAt = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  const btn = document.getElementById('btn-save-sheet');
  const btnText = document.getElementById('save-btn-text');
  btn.disabled = true; if (btnText) btnText.textContent = '送信中…';
  try {
    await fetch(gasUrl, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ savedAt, date: dateStr, dateJp: toReiwa(dateStr), addressee, amount, taxrate, taxBase, taxAmt, tadashi, shopname, issuer }),
    });
    showToast('✓ スプレッドシートに保存しました');
  } catch(e) {
    showToast('送信失敗。URL を確認してください', true);
  } finally {
    btn.disabled = false; if (btnText) btnText.textContent = 'スプレッドシートに保存';
  }
}

// ===== イベント =====
['f-addressee','f-date','f-amount','f-taxrate','f-tadashi','f-shopname','f-issuer'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', updateReceipt);
  el.addEventListener('change', updateReceipt);
});

// ===== 初期化 =====
sv('f-date', new Date().toISOString().split('T')[0]);
loadForm();
const savedSeal = localStorage.getItem(SEAL_K);
if (savedSeal) applySeal(savedSeal);
updateReceipt();
scaleReceipt();
</script>
</body>
</html>
