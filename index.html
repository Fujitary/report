<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>活動日報</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="活動日報">
<meta name="theme-color" content="#2563a8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --blue: #2563a8;
    --blue-light: #dbeafe;
    --blue-mid: #93c5fd;
    --gray: #6b7280;
    --gray-light: #f3f4f6;
    --border: #d1d5db;
    --text: #1f2937;
    --white: #ffffff;
    --accent: #1e40af;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans JP', sans-serif; background: #e8edf5; min-height: 100vh; color: var(--text); }
  #app { display: flex; flex-direction: column; min-height: 100vh; }

  header {
    background: var(--blue); color: white; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  header h1 { font-family: 'Noto Serif JP', serif; font-size: 18px; font-weight: 700; letter-spacing: 0.05em; }
  .header-btn {
    background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
    color: white; padding: 6px 14px; border-radius: 6px; font-size: 13px;
    font-family: 'Noto Sans JP', sans-serif; cursor: pointer; transition: background 0.2s;
  }
  .header-btn:hover { background: rgba(255,255,255,0.3); }
  .header-btn.primary { background: white; color: var(--blue); font-weight: 500; }

  .tab-bar {
    display: flex; background: white; border-bottom: 2px solid var(--blue-light);
    position: sticky; top: 53px; z-index: 99;
  }
  .tab {
    flex: 1; padding: 10px 4px; text-align: center; font-size: 12px;
    color: var(--gray); cursor: pointer; transition: all 0.2s;
    border-bottom: 3px solid transparent; margin-bottom: -2px;
  }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 700; }
  .tab .tab-icon { font-size: 18px; display: block; margin-bottom: 2px; }

  main { flex: 1; padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; }

  .section-card {
    background: white; border-radius: 10px; margin-bottom: 16px;
    overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .section-header {
    background: var(--blue); color: white; padding: 8px 14px;
    font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px;
  }
  .section-header::before { content: '■'; font-size: 10px; }
  .section-body { padding: 14px; }

  .form-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  .form-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 80px; }
  label { font-size: 11px; color: var(--gray); font-weight: 500; }

  input[type="text"], input[type="date"], input[type="time"], input[type="number"], select, textarea {
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
    font-size: 14px; font-family: 'Noto Sans JP', sans-serif; color: var(--text);
    background: #fafafa; transition: border-color 0.2s, box-shadow 0.2s;
    width: 100%; -webkit-appearance: none;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,168,0.15); background: white;
  }
  textarea { resize: none; line-height: 1.6; }
  .inline-label { font-size: 13px; white-space: nowrap; color: var(--text); }

  /* 文字数カウンター */
  .textarea-wrap { position: relative; }
  .char-counter {
    text-align: right; font-size: 11px; margin-top: 4px;
    color: var(--gray); transition: color 0.2s;
  }
  .char-counter.warn { color: #f59e0b; font-weight: 700; }
  .char-counter.over { color: #ef4444; font-weight: 700; }
  .char-bar {
    height: 3px; border-radius: 2px; background: var(--border);
    margin-top: 3px; overflow: hidden;
  }
  .char-bar-fill {
    height: 100%; border-radius: 2px;
    background: var(--blue); transition: width 0.2s, background 0.2s;
  }

  /* 参加者グリッド */
  .participant-group-label {
    font-size: 12px; font-weight: 700; color: var(--blue);
    background: var(--blue-light); padding: 5px 10px; border-radius: 6px;
    margin-bottom: 8px; margin-top: 4px;
  }
  .participant-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px;
  }
  .participant-item { display: flex; flex-direction: column; gap: 3px; }
  .participant-item label { font-size: 11px; }
  .participant-item input {
    padding: 6px 8px; font-size: 13px; text-align: center;
  }
  .participant-total {
    background: var(--blue-light); border-radius: 6px; padding: 8px 12px;
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 4px;
  }
  .participant-total span { font-size: 13px; color: var(--blue); font-weight: 700; }

  /* 写真 */
  .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .photo-slot {
    position: relative; background: var(--blue-light); border: 2px dashed var(--blue-mid);
    border-radius: 8px; aspect-ratio: 4/3; display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; overflow: hidden;
  }
  .photo-slot:hover { border-color: var(--blue); background: #dbeafe; }
  .photo-slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
  .photo-slot .photo-label-overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.5); color: white; font-size: 11px; padding: 4px 6px; display: none;
  }
  .photo-slot.has-img .photo-label-overlay { display: block; }
  .photo-slot .placeholder-text { font-size: 11px; color: var(--blue); text-align: center; }
  .photo-slot .placeholder-icon { font-size: 28px; margin-bottom: 4px; }
  .photo-caption { margin-top: 6px; display: flex; gap: 6px; align-items: center; }
  .photo-caption input { flex: 1; font-size: 12px; padding: 5px 8px; }
  .remove-photo {
    background: #ef4444; color: white; border: none; border-radius: 4px;
    width: 24px; height: 24px; font-size: 14px; cursor: pointer;
    display: none; align-items: center; justify-content: center; flex-shrink: 0;
  }
  input[type="file"] { display: none; }

  /* ボタン */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-family: 'Noto Sans JP', sans-serif; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
  .btn-primary { background: var(--blue); color: white; width: 100%; padding: 14px; font-size: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(37,99,168,0.3); }
  .btn-primary:hover { background: var(--accent); transform: translateY(-1px); }
  .btn-outline { background: white; color: var(--blue); border: 1.5px solid var(--blue); }
  .btn-outline:hover { background: var(--blue-light); }

  /* プレビュー */
  .preview-container { background: white; border-radius: 10px; padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.12); }
  .preview-title { font-family: 'Noto Serif JP', serif; font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 16px; letter-spacing: 0.1em; }
  .pv-section { margin-bottom: 14px; }
  .pv-header { background: var(--blue); color: white; padding: 5px 10px; font-size: 12px; font-weight: 700; margin-bottom: 8px; border-radius: 4px 4px 0 0; }
  .pv-header::before { content: '■ '; font-size: 9px; }
  .pv-body { border: 1px solid var(--border); border-top: none; padding: 10px; font-size: 12px; line-height: 1.7; border-radius: 0 0 4px 4px; }
  .pv-field { margin-bottom: 4px; }
  .pv-label { font-size: 10px; color: var(--gray); margin-bottom: 2px; }
  .pv-value { font-size: 12px; min-height: 18px; border-bottom: 1px solid var(--border); padding-bottom: 2px; }
  .pv-text { white-space: pre-wrap; min-height: 30px; }
  .pv-photos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pv-photo img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border: 1px solid var(--border); border-radius: 4px; }
  .pv-photo-cap { font-size: 10px; color: var(--gray); text-align: center; margin-top: 2px; }

  /* トースト */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1f2937; color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 1000; transition: transform 0.3s ease; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ===== 印刷用 A4 ===== */
  #print-area { display: none; }

  @media print {
    @page { size: A4; margin: 10mm 12mm 8mm; }
    body > #app { display: none !important; }
    #print-area {
      display: block !important;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 8.5pt;
      color: #000;
      line-height: 1.4;
    }

    .pr-title {
      text-align: center;
      font-family: 'Noto Serif JP', serif;
      font-size: 15pt;
      font-weight: 700;
      margin-bottom: 4mm;
      letter-spacing: 0.1em;
    }

    .pr-section { margin-bottom: 3mm; page-break-inside: avoid; }

    .pr-section-header {
      background: #2563a8 !important;
      color: white !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      padding: 2px 7px;
      font-size: 8.5pt;
      font-weight: 700;
      margin-bottom: 1.5mm;
    }
    .pr-section-header::before { content: '■ '; }

    .pr-table { width: 100%; border-collapse: collapse; font-size: 8pt; }
    .pr-table td { padding: 2px 5px; border: 0.4pt solid #bbb; vertical-align: middle; }
    .pr-label-cell { color: #555; white-space: nowrap; background: #f5f7fa !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; width: 14mm; font-weight: 500; }

    .pr-text-box {
      border: 0.4pt solid #bbb;
      padding: 2mm 3mm;
      white-space: pre-wrap;
      font-size: 8pt;
      line-height: 1.5;
    }
    .pr-small-label { font-size: 7.5pt; color: #555; margin-bottom: 0.5mm; font-weight: 500; }

    /* 参加者テーブル */
    .pr-pax-table { width: 100%; border-collapse: collapse; font-size: 7.5pt; }
    .pr-pax-table td { padding: 2px 4px; border: 0.4pt solid #bbb; text-align: center; }
    .pr-pax-table .pr-pax-group { background: #dbeafe !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-weight: 700; color: #1e40af; }
    .pr-pax-table .pr-pax-label { background: #f5f7fa !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-size: 7pt; color: #444; }
    .pr-pax-table .pr-pax-total { background: #eff6ff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-weight: 700; color: #1e40af; }

    /* 写真 */
    .pr-photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; }
    .pr-photo-item img { width: 100%; max-height: 52mm; object-fit: cover; border: 0.4pt solid #bbb; display: block; }
    .pr-photo-item .no-photo { width: 100%; height: 45mm; border: 0.4pt solid #ccc; display: flex; align-items: center; justify-content: center; color: #bbb; font-size: 7.5pt; }
    .pr-photo-caption { font-size: 7pt; color: #555; margin-top: 0.5mm; border-top: 0.3pt solid #eee; padding-top: 0.5mm; }

    .pr-footer { margin-top: 3mm; border-top: 0.4pt solid #ccc; padding-top: 2mm; font-size: 7pt; color: #999; display: flex; justify-content: space-between; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>📋 活動日報</h1>
    <div style="display:flex;gap:8px;">
      <button class="header-btn" onclick="switchView('edit')" id="btn-edit">編集</button>
      <button class="header-btn" onclick="switchView('preview')" id="btn-preview">プレビュー</button>
      <button class="header-btn primary" onclick="generatePDF()">📄 PDF</button>
    </div>
  </header>

  <div class="tab-bar">
    <div class="tab active" onclick="switchTab(0)" id="tab0"><span class="tab-icon">📄</span>基本情報</div>
    <div class="tab" onclick="switchTab(1)" id="tab1"><span class="tab-icon">✏️</span>活動記録</div>
    <div class="tab" onclick="switchTab(2)" id="tab2"><span class="tab-icon">📷</span>写真記録</div>
  </div>

  <main>
    <div id="edit-view">

      <!-- TAB 0: 基本情報 -->
      <div id="section-tab0">
        <div class="section-card">
          <div class="section-header">基本情報</div>
          <div class="section-body">
            <div class="form-row">
              <div class="form-group" style="flex:2">
                <label>日付</label>
                <input type="date" id="f-date">
              </div>
              <div class="form-group" style="flex:0.7">
                <label>曜日</label>
                <input type="text" id="f-day" maxlength="1" style="text-align:center;">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>開始時間</label>
                <input type="time" id="f-time-start">
              </div>
              <div class="inline-label" style="margin-top:20px;">〜</div>
              <div class="form-group">
                <label>終了時間</label>
                <input type="time" id="f-time-end">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>記録者</label>
                <input type="text" id="f-recorder" placeholder="氏名">
              </div>
              <div class="form-group">
                <label>場所</label>
                <input type="text" id="f-place" placeholder="活動場所">
              </div>
              <div class="form-group" style="flex:0.8">
                <label>天候</label>
                <select id="f-weather">
                  <option value="">-</option>
                  <option>晴れ</option><option>曇り</option><option>雨</option><option>雪</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- 参加者 -->
        <div class="section-card">
          <div class="section-header">参加者</div>
          <div class="section-body">
            <div class="participant-group-label">👧 こども</div>
            <div class="participant-grid">
              <div class="participant-item">
                <label>未就学児</label>
                <input type="number" id="p-preschool" min="0" placeholder="0" oninput="calcTotal()">
              </div>
              <div class="participant-item">
                <label>小学生</label>
                <input type="number" id="p-elementary" min="0" placeholder="0" oninput="calcTotal()">
              </div>
              <div class="participant-item">
                <label>中学生</label>
                <input type="number" id="p-junior" min="0" placeholder="0" oninput="calcTotal()">
              </div>
              <div class="participant-item">
                <label>高校生</label>
                <input type="number" id="p-senior" min="0" placeholder="0" oninput="calcTotal()">
              </div>
            </div>

            <div class="participant-group-label">👨 大人</div>
            <div class="participant-grid">
              <div class="participant-item">
                <label>学校関係</label>
                <input type="number" id="p-school" min="0" placeholder="0" oninput="calcTotal()">
              </div>
              <div class="participant-item">
                <label>地域住民</label>
                <input type="number" id="p-community" min="0" placeholder="0" oninput="calcTotal()">
              </div>
              <div class="participant-item">
                <label>大学生</label>
                <input type="number" id="p-univ" min="0" placeholder="0" oninput="calcTotal()">
              </div>
              <div class="participant-item">
                <label>その他</label>
                <input type="number" id="p-other" min="0" placeholder="0" oninput="calcTotal()">
              </div>
            </div>

            <div class="participant-total">
              <span id="total-display">合計 0名　｜　こども 0名　大人 0名</span>
            </div>
          </div>
        </div>
      </div>

      <!-- TAB 1: 活動記録 -->
      <div id="section-tab1" style="display:none;">
        <div class="section-card">
          <div class="section-header">活動の記録</div>
          <div class="section-body">
            <div class="form-group" style="margin-bottom:14px;">
              <label>【実施内容】<span style="color:var(--gray);font-weight:400;">（300字以内）</span></label>
              <div class="textarea-wrap">
                <textarea id="f-content" rows="7" maxlength="300" placeholder="実施した活動内容を詳しく記録してください" oninput="updateCounter('f-content','cnt-content',300)"></textarea>
                <div class="char-counter" id="cnt-content">0 / 300 文字</div>
                <div class="char-bar"><div class="char-bar-fill" id="bar-content" style="width:0%"></div></div>
              </div>
            </div>
            <div class="form-group">
              <label>【所感・気づき・課題】<span style="color:var(--gray);font-weight:400;">（200字以内）</span></label>
              <div class="textarea-wrap">
                <textarea id="f-impression" rows="5" maxlength="200" placeholder="感じたこと、気づいたこと、今後の課題など" oninput="updateCounter('f-impression','cnt-impression',200)"></textarea>
                <div class="char-counter" id="cnt-impression">0 / 200 文字</div>
                <div class="char-bar"><div class="char-bar-fill" id="bar-impression" style="width:0%"></div></div>
              </div>
            </div>
          </div>
        </div>
        <button class="btn btn-primary" onclick="switchView('preview')" style="margin-bottom:20px;">
          👁 プレビューを確認する
        </button>
      </div>

      <!-- TAB 2: 写真記録 -->
      <div id="section-tab2" style="display:none;">
        <div class="section-card">
          <div class="section-header">写真記録</div>
          <div class="section-body">
            <div class="photo-grid">
              <div>
                <div class="photo-slot" id="slot0" onclick="document.getElementById('file0').click()">
                  <span class="placeholder-icon">📷</span><span class="placeholder-text">写真を添付</span>
                  <div class="photo-label-overlay" id="overlay0"></div>
                </div>
                <input type="file" id="file0" accept="image/*" onchange="handlePhoto(0,this)">
                <div class="photo-caption">
                  <input type="text" id="cap0" placeholder="キャプション">
                  <button class="remove-photo" id="rm0" onclick="removePhoto(0)">✕</button>
                </div>
              </div>
              <div>
                <div class="photo-slot" id="slot1" onclick="document.getElementById('file1').click()">
                  <span class="placeholder-icon">📷</span><span class="placeholder-text">写真を添付</span>
                  <div class="photo-label-overlay" id="overlay1"></div>
                </div>
                <input type="file" id="file1" accept="image/*" onchange="handlePhoto(1,this)">
                <div class="photo-caption">
                  <input type="text" id="cap1" placeholder="キャプション">
                  <button class="remove-photo" id="rm1" onclick="removePhoto(1)">✕</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <button class="btn btn-primary" onclick="generatePDF()" style="margin-bottom:20px;">
          📄 PDFを作成・保存
        </button>
      </div>

    </div><!-- /edit-view -->

    <!-- PREVIEW VIEW -->
    <div id="preview-view" style="display:none;">
      <div class="preview-container" id="preview-content"></div>
      <div style="margin-top:16px;display:flex;gap:10px;">
        <button class="btn btn-outline" onclick="switchView('edit')" style="flex:1;">← 編集に戻る</button>
        <button class="btn btn-primary" onclick="generatePDF()" style="flex:1;">📄 PDFを保存</button>
      </div>
    </div>
  </main>
</div>

<div id="print-area"></div>
<div class="toast" id="toast"></div>

<script>
let photos = [null,null];
let currentTab = 0;

// 起動時に今日の日付
window.addEventListener('load', () => {
  const today = new Date();
  document.getElementById('f-date').value = today.toISOString().split('T')[0];
  updateDay();
  document.getElementById('f-date').addEventListener('change', updateDay);
});

function updateDay() {
  const d = new Date(document.getElementById('f-date').value + 'T00:00:00');
  document.getElementById('f-day').value = ['日','月','火','水','木','金','土'][d.getDay()];
}

// 文字数カウンター
function updateCounter(fieldId, counterId, max) {
  const val = document.getElementById(fieldId).value;
  const len = val.length;
  const pct = Math.min(len / max * 100, 100);
  const counter = document.getElementById(counterId);
  const bar = document.getElementById('bar-' + fieldId.replace('f-',''));
  counter.textContent = `${len} / ${max} 文字`;
  counter.className = 'char-counter' + (len >= max ? ' over' : len >= max * 0.8 ? ' warn' : '');
  if (bar) {
    bar.style.width = pct + '%';
    bar.style.background = len >= max ? '#ef4444' : len >= max * 0.8 ? '#f59e0b' : '#2563a8';
  }
}

// 参加者合計
function calcTotal() {
  const ids = ['p-preschool','p-elementary','p-junior','p-senior','p-school','p-community','p-univ','p-other'];
  const pax = getPaxValues();
  document.getElementById('total-display').textContent =
    `合計 ${pax.total}名　｜　こども ${pax.kids}名　大人 ${pax.adults}名`;
}

function getPaxValues() {
  return {
    preschool: parseInt(document.getElementById('p-preschool').value)||0,
    elementary: parseInt(document.getElementById('p-elementary').value)||0,
    junior: parseInt(document.getElementById('p-junior').value)||0,
    senior: parseInt(document.getElementById('p-senior').value)||0,
    school: parseInt(document.getElementById('p-school').value)||0,
    community: parseInt(document.getElementById('p-community').value)||0,
    univ: parseInt(document.getElementById('p-univ').value)||0,
    other: parseInt(document.getElementById('p-other').value)||0,
    get total() { return this.preschool+this.elementary+this.junior+this.senior+this.school+this.community+this.univ+this.other; },
    get kids() { return this.preschool+this.elementary+this.junior+this.senior; },
    get adults() { return this.school+this.community+this.univ+this.other; }
  };
}

// タブ
function switchTab(n) {
  for (let i=0;i<3;i++) {
    document.getElementById(`tab${i}`).classList.toggle('active', i===n);
    document.getElementById(`section-tab${i}`).style.display = i===n ? '' : 'none';
  }
  currentTab = n;
}

// ビュー
function switchView(v) {
  document.getElementById('edit-view').style.display = v==='edit' ? '' : 'none';
  document.getElementById('preview-view').style.display = v==='preview' ? '' : 'none';
  if (v==='preview') renderPreview();
}

// 写真
function handlePhoto(idx, input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    photos[idx] = e.target.result;
    const slot = document.getElementById(`slot${idx}`);
    const old = slot.querySelector('img'); if (old) old.remove();
    const img = document.createElement('img'); img.src = e.target.result; slot.appendChild(img);
    slot.classList.add('has-img');
    document.getElementById(`rm${idx}`).style.display = 'flex';
    document.getElementById(`overlay${idx}`).textContent = file.name;
  };
  reader.readAsDataURL(file);
}
function removePhoto(idx) {
  photos[idx] = null;
  const slot = document.getElementById(`slot${idx}`);
  const img = slot.querySelector('img'); if (img) img.remove();
  slot.classList.remove('has-img');
  document.getElementById(`rm${idx}`).style.display = 'none';
  document.getElementById(`file${idx}`).value = '';
  document.getElementById(`overlay${idx}`).textContent = '';
}

// ===== PDF生成（Canvas描画方式 → 日本語文字化け解消） =====
// スマホのシステムフォントでCanvasに描画 → JPEG化してjsPDFに貼り込む

async function generatePDF() {
  showToast('PDFを生成中…');

  // データ収集
  const date       = document.getElementById('f-date').value;
  const day        = document.getElementById('f-day').value;
  const ts         = document.getElementById('f-time-start').value;
  const te         = document.getElementById('f-time-end').value;
  const recorder   = document.getElementById('f-recorder').value;
  const place      = document.getElementById('f-place').value;
  const weather    = document.getElementById('f-weather').value;
  const content    = document.getElementById('f-content').value;
  const impression = document.getElementById('f-impression').value;
  const pax        = getPaxValues();
  const cap0       = document.getElementById('cap0').value || '写真1';
  const cap1       = document.getElementById('cap1').value || '写真2';
  const dateStr    = date ? date.replace(/-/g,'/') + `（${day}）` : '';
  const timeStr    = (ts||te) ? `${ts||''}〜${te||''}` : '';
  const now        = new Date().toLocaleString('ja-JP');
  const fileName   = `活動日報_${date||'日付未設定'}.pdf`;

  try {
    // ===== A4 Canvas（2倍解像度） =====
    // 1mm = 3.7795px @ 96dpi → A4: 794×1123px → ×2 = 1587×2245
    const SCALE = 2;
    const PXW = 794 * SCALE, PXH = 1123 * SCALE;
    const cv  = document.createElement('canvas');
    cv.width = PXW; cv.height = PXH;
    const ctx = cv.getContext('2d');

    // mm→px変換
    const mm = v => v * 3.7795 * SCALE;

    // マージン・幅
    const ML = mm(12), MT = mm(12), CW = mm(186);
    let y = MT;

    // フォント
    const FONT_JP = `"Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif`;

    // ====== ヘルパ関数 ======

    // 背景白塗り
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, PXW, PXH);

    function sectionHeader(label) {
      const h = mm(6);
      ctx.fillStyle = '#2563a8';
      ctx.fillRect(ML, y, CW, h);
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${mm(3.8)}px ${FONT_JP}`;
      ctx.textBaseline = 'middle';
      ctx.fillText('■ ' + label, ML + mm(2), y + h/2);
      y += h + mm(1.5);
    }

    // 1行テーブル描画
    function tableRow(cols) {
      const h = mm(6);
      let x = ML;
      cols.forEach(({label, value, w, isLabel}) => {
        const pw = mm(w);
        // 枠
        ctx.strokeStyle = '#bbbbbb';
        ctx.lineWidth = 1;
        ctx.fillStyle = isLabel ? '#f5f7fa' : '#ffffff';
        ctx.fillRect(x, y, pw, h);
        ctx.strokeRect(x, y, pw, h);
        // テキスト
        ctx.fillStyle = isLabel ? '#555555' : '#111111';
        ctx.font = `${isLabel ? 'normal' : 'normal'} ${mm(3.2)}px ${FONT_JP}`;
        ctx.textBaseline = 'middle';
        const txt = isLabel ? label : String(value||'');
        // はみ出し防止
        ctx.save();
        ctx.rect(x+mm(1), y, pw-mm(2), h);
        ctx.clip();
        ctx.fillText(txt, x + mm(1.2), y + h/2);
        ctx.restore();
        x += pw;
      });
      y += h;
    }

    // テキストボックス（折り返し対応）
    function textBox(sublabel, text, minHmm) {
      const FONT_SIZE = mm(3.5);
      const LINE_H    = FONT_SIZE * 1.7;
      const maxW      = CW - mm(4);

      // サブラベル
      ctx.fillStyle = '#555555';
      ctx.font = `normal ${mm(3)}px ${FONT_JP}`;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(sublabel, ML, y + mm(3.5));
      y += mm(5);

      // テキスト折り返し
      ctx.font = `normal ${FONT_SIZE}px ${FONT_JP}`;
      const lines = wrapText(ctx, text || '', maxW);
      const boxH  = Math.max(mm(minHmm), lines.length * LINE_H + mm(4));

      // 枠
      ctx.strokeStyle = '#bbbbbb'; ctx.lineWidth = 1;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(ML, y, CW, boxH);
      ctx.strokeRect(ML, y, CW, boxH);

      // テキスト描画
      ctx.fillStyle = '#111111';
      ctx.textBaseline = 'top';
      lines.forEach((line, i) => {
        ctx.fillText(line, ML + mm(2), y + mm(2) + i * LINE_H);
      });
      y += boxH + mm(2);
    }

    // テキスト折り返し
    function wrapText(ctx, text, maxW) {
      const result = [];
      (text || '').split('\n').forEach(para => {
        if (para === '') { result.push(''); return; }
        let line = '';
        for (const ch of para) {
          const test = line + ch;
          if (ctx.measureText(test).width > maxW && line !== '') {
            result.push(line);
            line = ch;
          } else {
            line = test;
          }
        }
        if (line) result.push(line);
      });
      return result.length ? result : [''];
    }

    // 写真埋め込み（Canvas内に直接描画）
    async function drawPhoto(src, px, py, pw, ph, caption) {
      ctx.strokeStyle = '#bbbbbb'; ctx.lineWidth = 1;
      if (src) {
        const img = new Image(); img.src = src;
        await new Promise(r => { img.onload = r; img.onerror = r; });
        // object-fit:cover 相当
        const ar = img.width / img.height;
        const br = pw / ph;
        let sx,sy,sw,sh;
        if (ar > br) { sh=img.height; sw=sh*br; sx=(img.width-sw)/2; sy=0; }
        else         { sw=img.width;  sh=sw/br; sy=(img.height-sh)/2; sx=0; }
        ctx.drawImage(img, sx, sy, sw, sh, px, py, pw, ph);
        ctx.strokeRect(px, py, pw, ph);
      } else {
        ctx.fillStyle = '#f0f4f8';
        ctx.fillRect(px, py, pw, ph);
        ctx.strokeRect(px, py, pw, ph);
        ctx.fillStyle = '#bbbbbb';
        ctx.font = `normal ${mm(3.5)}px ${FONT_JP}`;
        ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
        ctx.fillText('[ 写真なし ]', px + pw/2, py + ph/2);
        ctx.textAlign = 'left';
      }
      // キャプション
      ctx.fillStyle = '#555555';
      ctx.font = `normal ${mm(3)}px ${FONT_JP}`;
      ctx.textBaseline = 'top';
      ctx.fillText(caption, px + mm(1), py + ph + mm(1));
    }

    // ====== 描画開始 ======

    // タイトル
    ctx.fillStyle = '#111111';
    ctx.font = `bold ${mm(8)}px ${FONT_JP}`;
    ctx.textBaseline = 'top'; ctx.textAlign = 'center';
    ctx.fillText('活 動 日 報', PXW/2, y);
    ctx.textAlign = 'left';
    y += mm(14);

    // 基本情報
    sectionHeader('基本情報');
    const c1=24,c2=52,c3=16,c4=46,c5=16,c6=186-c1-c2-c3-c4-c5;
    tableRow([
      {label:'日付',   w:c1, isLabel:true},
      {value:dateStr,  w:c2},
      {label:'時間',   w:c3, isLabel:true},
      {value:timeStr,  w:c4},
      {label:'天候',   w:c5, isLabel:true},
      {value:weather,  w:c6},
    ]);
    tableRow([
      {label:'記録者', w:c1, isLabel:true},
      {value:recorder, w:c2},
      {label:'場所',   w:c3, isLabel:true},
      {value:place,    w:c4+c5+c6},
    ]);
    y += mm(3);

    // 参加者
    sectionHeader(`参加者　合計 ${pax.total}名  ｜  こども ${pax.kids}名  大人 ${pax.adults}名`);
    const paxLabels = ['未就学児','小学生','中学生','高校生','学校関係','地域住民','大学生','その他'];
    const paxVals   = [pax.preschool,pax.elementary,pax.junior,pax.senior,pax.school,pax.community,pax.univ,pax.other];
    const pcw = CW / 8;
    const rowH = mm(5);
    // ラベル行
    paxLabels.forEach((l,i) => {
      const x = ML + pcw*i;
      ctx.fillStyle = '#f5f7fa'; ctx.fillRect(x, y, pcw, rowH);
      ctx.strokeStyle = '#bbbbbb'; ctx.strokeRect(x, y, pcw, rowH);
      ctx.fillStyle = '#555555';
      ctx.font = `normal ${mm(2.8)}px ${FONT_JP}`;
      ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
      ctx.fillText(l, x + pcw/2, y + rowH/2);
    });
    y += rowH;
    // 数値行
    paxVals.forEach((v,i) => {
      const x = ML + pcw*i;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, pcw, rowH);
      ctx.strokeStyle = '#bbbbbb'; ctx.strokeRect(x, y, pcw, rowH);
      ctx.fillStyle = '#111111';
      ctx.font = `bold ${mm(3.8)}px ${FONT_JP}`;
      ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
      ctx.fillText(String(v), x + pcw/2, y + rowH/2);
    });
    ctx.textAlign = 'left';
    y += rowH + mm(3);

    // 活動記録
    sectionHeader('活動の記録');
    textBox('【実施内容】', content, 28);
    textBox('【所感・気づき・課題】', impression, 20);
    y += mm(1);

    // 写真
    sectionHeader('写真記録');
    const photoW = (CW - mm(4)) / 2;
    const photoH = photoW * 0.68;
    await drawPhoto(photos[0], ML,              y, photoW, photoH, cap0);
    await drawPhoto(photos[1], ML+photoW+mm(4), y, photoW, photoH, cap1);
    y += photoH + mm(8);

    // フッター
    ctx.strokeStyle = '#cccccc'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ML, y); ctx.lineTo(ML+CW, y); ctx.stroke();
    y += mm(2.5);
    ctx.fillStyle = '#aaaaaa';
    ctx.font = `normal ${mm(2.8)}px ${FONT_JP}`;
    ctx.textBaseline = 'top';
    ctx.fillText('leal.lab 活動日報', ML, y);
    ctx.textAlign = 'right';
    ctx.fillText('出力日時：' + now, ML+CW, y);
    ctx.textAlign = 'left';

    // ===== jsPDFにCanvasを貼り付け =====
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
    const jpeg = cv.toDataURL('image/jpeg', 0.92);
    pdf.addImage(jpeg, 'JPEG', 0, 0, 210, 297);
    pdf.save(fileName);
    showToast('PDFを保存しました ✓');

  } catch(e) {
    console.error(e);
    showToast('PDF生成に失敗しました: ' + e.message);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
